# Stellar 2.0.0 overrides; remaining settings inherit the installed theme defaults.
# v2 shares cover across lists and banners; CSS retains the original list images.
leftbar:
  brand:
    image:
      src: /images/avatar.webp
    name: 玄渊
    tagline: 玄渊的个人博客
    href: /
  menu:
    - id: post
      icon: default:documents
      title: 博客
      url: /
      accent: '#1BCDFC'
    - id: project
      icon: example:notebook
      title: 文档
      url: /project/
      accent: '#3DC550'
profiles:
  author:
    leftbar:
      widgets:
        - recent
        - timeline
    rightbar:
      widgets:
        - timeline
  error:
    leftbar:
      widgets:
        - recent
        - timeline
    rightbar:
      widgets:
        - timeline
article:
  footer:
    share: []
  banner:
    background: false
  listing:
    card_layout: classic
appearance:
  preset: glass
  typography:
    font_size:
      root: 17px
  shape:
    radius:
      bar: 8px
  backgrounds:
    leftbar:
      type: image
      image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg
      opacity: 0.8
comments:
  provider: giscus
  title: 快来参与讨论吧~
  giscus:
    data-repo: xuanyuan-maker/my-blog-comments
    data-repo-id: R_kgDOQ6KWaA
    data-category: Announcements
    data-category-id: DIC_kwDOQ6KWaM4C0-h2
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: bottom
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous
footer:
  content: |
    <div style="display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;line-height:1.8;">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"
         style="text-decoration:none;">
        晋ICP备2025058428号-1
      </a>

      <span style="opacity:.6;">|</span>

      <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=14011002011318"
         target="_blank" rel="noopener"
         style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;">
        <img src="/images/beian.png" alt="公安备案"
             style="height:16px;width:auto;display:inline-block;vertical-align:middle;">
        晋公网安备14011002011318号
      </a>
    </div>

    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。
features:
  reveal:
    enabled: false
canonical:
  host: xuanyuan-maker.github.io
inject:
  body_end: <script>document.querySelectorAll(".brand-header--site .brand-image--avatar").forEach(avatar => avatar.setAttribute("href", "/about/"));</script>
  head_end: |-
    <style>
    .post-card[href="/2026/04/10/2024LQB-pwn-wp/"] .post-cover img { content: url("/images/banner-5.webp"); }
    .post-card[href="/2025/08/08/Pwn-introductio-What-is-pwn/"] .post-cover { display: none; }
    .post-card[href="/2026/06/13/cve-2017-17215/"] .post-cover img { content: url("/images/banner-11.webp"); }
    .post-card[href="/2026/06/09/cve-2018-5767/"] .post-cover img { content: url("/images/banner-3.webp"); }
    .post-card[href="/2026/01/29/format-string/"] .post-cover img { content: url("/images/banner-9.webp"); }
    .post-card[href="/2026/02/04/ret2csu/"] .post-cover img { content: url("/images/banner-7.webp"); }
    .post-card[href="/2025/08/08/test/"] .post-cover img { content: url("/images/banner-1.webp"); }
    </style>
